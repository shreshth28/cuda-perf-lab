name: matmul
hosts: gpu
source:
  repo: https://github.com/shreshth28/cuda-perf-lab
env:
  PATH: /usr/local/cuda/bin:$PATH
build: make bin/matmul bin/matmul_cpu
variants:
  cpu_omp: './bin/matmul_cpu --kernel omp --n {{ n }} --iters 1 --warmup 0 --no-check'
  naive:   './bin/matmul --kernel naive --n {{ n }}'
  tiled:   './bin/matmul --kernel tiled --n {{ n }}'
  reg1d:   './bin/matmul --kernel reg1d --n {{ n }}'
  reg2d:   './bin/matmul --kernel reg2d --n {{ n }}'
  vec4:    './bin/matmul --kernel vec4 --n {{ n }}'
  cublas:  './bin/matmul --kernel cublas --n {{ n }}'
  cl_naive: {build: make bin/cl_matmul, run: './bin/cl_matmul --kernel naive --n {{ n }}'}
  cl_tiled: {build: make bin/cl_matmul, run: './bin/cl_matmul --kernel tiled --n {{ n }}'}
  cl_reg2d: {build: make bin/cl_matmul, run: './bin/cl_matmul --kernel reg2d --n {{ n }}'}
matrix:
  n: [512, 1024, 2048, 4096]
timing:
  from: output
  regex: 'time_ms=([0-9.]+)'
  unit: ms
metrics:
  gflops: 'gflops=([0-9.]+)'
repeat: 5
warmup: 1
timeout: 600
