name: vecadd
hosts: gpu
source:
  repo: https://github.com/shreshth28/cuda-perf-lab
env:
  PATH: /usr/local/cuda/bin:$PATH
build: make bin/vecadd
variants:
  naive:  './bin/vecadd --kernel naive --n {{ n }}'
  stride: './bin/vecadd --kernel stride --n {{ n }}'
  vec4:   './bin/vecadd --kernel vec4 --n {{ n }}'
  cublas: './bin/vecadd --kernel cublas --n {{ n }}'
  cl_naive: {build: make bin/cl_vecadd, run: './bin/cl_vecadd --kernel naive --n {{ n }}'}
  cl_vec4:  {build: make bin/cl_vecadd, run: './bin/cl_vecadd --kernel vec4 --n {{ n }}'}
matrix:
  n: [1048576, 16777216, 67108864]
timing:
  from: output
  regex: 'time_ms=([0-9.]+)'
  unit: ms
metrics:
  gbps: 'gbps=([0-9.]+)'
repeat: 5
warmup: 1
